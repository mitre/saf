name: Build macOS Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install locked dependencies
        uses: $/.github/actions/setup-node

      - name: Compile and package macOS installers
        run: npx oclif pack macos

      - name: Rename Mac Installers
        run: |
          cd dist/macos
          for file in saf-*.pkg; do
            prefix=${file%-*-*.pkg}
            suffix=${file#saf-*-*-*}
            mv "$file" "$prefix-$suffix"
          done

      - name: Upload SAF-CLI macOS Installer Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAF-CLI macOS Installer
          path: dist/macos/saf-*.pkg
