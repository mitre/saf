name: Push SAF-CLI to NPM, GPR, and Homebrew tap
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ env.RELEASE_TAG }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js and install locked dependencies
        uses: $/.github/actions/setup-node

      - name: Compile and pack the release
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload the release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/mitre-saf-${{ env.RELEASE_TAG }}.tgz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Set up Node.js and npm registry authentication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global --ignore-scripts npm@11 # zizmor: ignore[adhoc-packages] -- Node 22 needs newer npm for OIDC.

      - name: Download the release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      - name: Publish the tarball to npm
        run: npm publish --access public mitre-saf-*.tgz

      - name: Configure GitHub Packages authentication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Publish the same tarball to GitHub Packages
        run: npm publish --access public mitre-saf-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Update Homebrew to the published npm version
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: saf-cli
          homebrew-tap: mitre/homebrew-saf
          download-url: https://registry.npmjs.org/@mitre/saf/-/saf-${{ needs.build.outputs.version }}.tgz
          tag-name: ${{ needs.build.outputs.version }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_PAT }}
