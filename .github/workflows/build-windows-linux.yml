name: Build SAF-CLI Windows/Linux Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: saf

      - name: Set up Node.js and install locked dependencies
        uses: ./saf/.github/actions/setup-node
        with:
          working-directory: saf

      - name: Install Nullsoft Scriptable Install System
        # p7zip-full and apt-utils are also required; Ubuntu runners provide them by default
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nsis

      - name: Compile and create one npm tarball for Windows and Debian
        working-directory: ./saf
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Package Windows installers from the npm tarball
        working-directory: ./saf
        run: |
          cp "$RUNNER_TEMP"/mitre-saf-*.tgz "$RUNNER_TEMP/saf-win.tgz"
          npx oclif pack win --tarball "$RUNNER_TEMP/saf-win.tgz"

      - name: Package Debian installers from the same npm tarball
        working-directory: ./saf
        run: npx oclif pack deb --tarball "$RUNNER_TEMP"/mitre-saf-*.tgz

      - name: Rename Windows Installers
        run: |
          cd saf/dist/win32
          for file in saf-*.exe; do
            prefix=${file%-*-*}     # get prefix by removing from end
            suffix=${file#saf-*-*-} # get suffix by removing from start
            mv "$file" "$prefix-$suffix"
          done

      - name: Rename Debian Installers
        run: |
          cd saf/dist/deb
          for file in saf_*.deb; do
            prefix=${file%.*-*.deb}
            prefix_ver=${prefix#saf_}
            suffix=${file#*_*_}
            mv "$file" "saf-$prefix_ver-$suffix"
          done

      - name: Upload SAF-CLI Windows Build x64 Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAF-CLI Windows Build x64
          path: saf/dist/win32/saf-*-x64.exe

      - name: Upload SAF-CLI Windows Build x86 Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAF-CLI Windows Build x86
          path: saf/dist/win32/saf-*-x86.exe

      - name: Upload SAF-CLI Debian x64 Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAF-CLI Debian Build x64
          path: saf/dist/deb/saf-*.deb
