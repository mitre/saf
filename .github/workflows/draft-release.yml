name: Draft Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # required to update the draft release
  pull-requests: read # required to get information about the pull request

jobs:
  update_draft_release:
    runs-on: ubuntu-24.04
    steps:
      - name: Update draft release notes from merged pull requests
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
