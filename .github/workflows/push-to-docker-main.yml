name: Push SAF CLI to Docker Hub on every push to main and tag as latest

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push amd64 and arm64 images to Docker Hub
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: mitre/saf:latest,mitre/saf:${{ github.sha }}

      - name: Update Iron Bank from the published image
        uses: $/.github/actions/update-ironbank
        with:
          version: ${{ github.sha }}
          image-digest: ${{ steps.docker_build.outputs.digest }}
          project-id: 17078
          project-name: saf-mainline
          username: ${{ secrets.SAF_IRONBANK_REPO1_USERNAME }}
          token: ${{ secrets.SAF_IRONBANK_REPO1_PAT }}
