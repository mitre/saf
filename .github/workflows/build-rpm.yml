name: Build SAF-CLI RPM Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    container:
      image: registry.access.redhat.com/ubi9/nodejs-22:latest
      options: -u 0 # dnf needs root
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: saf

      - name: Set up Node.js and install locked dependencies
        uses: ./saf/.github/actions/setup-node
        with:
          working-directory: saf

      - name: Install RPM packaging tools
        run: dnf install -y rpm-build perl-Digest-SHA # rpmbuild, shasum

      - name: Set RPM source tarball filename
        working-directory: ./saf
        run: |
          echo "filename=saf-v$(cat VERSION)-linux-x64" >> "$GITHUB_ENV"

      - name: Compile and package the Linux x64 tarball with locked oclif
        working-directory: ./saf
        run: npx oclif pack tarballs -t linux-x64 --no-xz

      - name: Add the RPM spec to the Linux tarball
        working-directory: ./saf/dist
        run: |
          gzip -dc saf-*-linux-x64.tar.gz > "$filename.tar"
          tar -rf "$filename.tar" --transform 's|^\.\.|saf|' ../saf.spec
          gzip "$filename.tar"

      - name: Build the RPM installer
        working-directory: ./saf
        run: rpmbuild -ta "dist/$filename.tar.gz" -D "_rpmdir $(pwd)" -D "version $(cat VERSION)"

      - name: Upload the RPM installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SAF-CLI RPM Build noarch
          path: saf/noarch/saf-*.rpm
