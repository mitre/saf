name: SBOM + Vex and Docker image smoketest

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without cached layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: saf:sbom
          # Disable layer caching so cached successes cannot hide build failures.
          no-cache: true
          pull: true

      - name: Smoke-test the image before scanning
        run: docker run --rm saf:sbom

      - name: Inventory image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: docker:saf:sbom
          format: syft-json
          output-file: ${{ runner.temp }}/syft.json
          dependency-snapshot: ${{ github.event_name == 'push' }}
          upload-artifact: false

      - name: Identify vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/syft.json
          output-format: cyclonedx-json
          output-file: ${{ runner.temp }}/image.cdx.json
          fail-build: false
          cache-db: true

      - name: Upload CycloneDX SBOM with vulnerability findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-linux-amd64
          path: ${{ runner.temp }}/image.cdx.json
          if-no-files-found: error
