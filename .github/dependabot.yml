# New ecosystems default to auto-merge; review auto-approve-and-merge.yml when adding one.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
      time: "20:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    allow:
      # Allow both direct and indirect updates for all packages.
      - dependency-type: "all"

  # GH Actions are set to automerge minor/patch but require manual review for major versions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      actions-deps:
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: daily
      time: "20:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
